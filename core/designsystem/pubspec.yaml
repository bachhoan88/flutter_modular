name: core_designsystem
description: "Design system core module"

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  freezed: '>=3.1.0 <3.2.0'
  json_serializable: ^6.7.1

# Config generate when build
flutter_gen:
  output: lib/gen/
  line_length: 160
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: true
  fonts:
    enabled: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/ic_netflix.png
    - assets/images/ic_menu.png

  module:
    androidX: true
    androidPackage: com.flutterexample.modular.designsystem
    iosBundleIdentifier: com.flutterexample.modular.designsystem
